      <span class="eyebrow">第一章</span>
      <h1>街巷</h1>
      <p>在武汉走路，最花时间的不是路远，是不停地抬头。四张照片，四个方向。</p>
    </div>
  </div>

  <section class="section">
    <div class="wrap">
      <div class="gallery">

        <figure>
          <img src="../image/street-towers.jpg" alt="武汉街头的高楼与商场入口">
          <figcaption>从地铁口上来就是光谷步行街，招牌比人还高。玻璃幕墙一直往上，看不到顶，阳光在上面晃成一片白。</figcaption>
        </figure>

        <figure>
          <img src="../image/old-building.jpg" alt="汉口老街上的欧式转角建筑">
          <figcaption>转弯的时候撞见这栋楼。石头外墙，一层一层的小窗，底下开着店，门口停着电动车。旧的新的就这么挤在一起。</figcaption>
        </figure>

        <figure>
          <img src="../image/riverside.jpg" alt="从江边望向对岸的城市天际线">
          <figcaption>沿江走，对岸的楼顶连成一条线。江面比想象中宽，船开过去要很久。</figcaption>
        </figure>

        <figure>
          <img src="../image/bridge.jpg" alt="蓝天下的桥梁与远处的高楼">
          <figcaption>桥上风大，旗子一直在响。低头是江水，抬头是另一座桥的钢索。</figcaption>
        </figure>

      </div>

      <p class="lede">这四张都是在路上随手拍的，没有特意等光。武汉的好看不在某一个点上，是走在路上突然就被什么东西撞一下——一栋楼、一阵风、或者一条突然出现的江。</p>
